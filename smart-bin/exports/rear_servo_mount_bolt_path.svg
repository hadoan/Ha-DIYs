<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-label="Exploded schematic showing rear plate, bell crank support, future flipped servo adapter, and separate M3 and M2 bolt paths">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#263547"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #182332; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 20px; }
      .part { font-size: 20px; font-weight: 700; }
      .small { font-size: 17px; }
      .note { font-size: 20px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1400" height="850" fill="#f7f9fc"/>
  <text x="60" y="65" class="title">How the flipped servo will attach to the rear plate</text>
  <text x="60" y="102" class="subtitle">Exploded concept — spacing and the new adapter are not yet print-ready</text>

  <rect x="60" y="150" width="1280" height="465" rx="22" fill="#ffffff" stroke="#d7e0e9" stroke-width="2"/>

  <!-- Stationary bin wall and plate feet -->
  <rect x="94" y="225" width="60" height="310" rx="7" fill="#e0d8c9" stroke="#9d9381" stroke-width="3"/>
  <text x="124" y="567" class="part" text-anchor="middle">Bin wall</text>
  <rect x="175" y="252" width="37" height="47" rx="10" fill="#5d87d7"/>
  <rect x="175" y="461" width="37" height="47" rx="10" fill="#5d87d7"/>
  <rect x="210" y="215" width="70" height="330" rx="16" fill="#3466bc" stroke="#1f4384" stroke-width="3"/>
  <circle cx="245" cy="285" r="11" fill="#f7f9fc" stroke="#1f4384" stroke-width="2"/>
  <circle cx="245" cy="475" r="11" fill="#f7f9fc" stroke="#1f4384" stroke-width="2"/>
  <text x="245" y="587" class="part" text-anchor="middle">Rear plate</text>

  <!-- Support flange -->
  <rect x="324" y="235" width="62" height="290" rx="5" fill="#aab6c5" stroke="#68788c" stroke-width="3"/>
  <circle cx="355" cy="285" r="11" fill="#f7f9fc" stroke="#68788c" stroke-width="2"/>
  <circle cx="355" cy="475" r="11" fill="#f7f9fc" stroke="#68788c" stroke-width="2"/>
  <path d="M386 390 L465 230 L465 250 L386 470 Z" fill="#b9c3d0" stroke="#68788c" stroke-width="3"/>
  <text x="356" y="587" class="part" text-anchor="middle">Support</text>

  <!-- Future bracket -->
  <rect x="502" y="240" width="133" height="280" rx="16" fill="#dff6ee" stroke="#16846d" stroke-width="4" stroke-dasharray="15 10"/>
  <circle cx="536" cy="285" r="11" fill="#ffffff" stroke="#16846d" stroke-width="2"/>
  <circle cx="536" cy="475" r="11" fill="#ffffff" stroke="#16846d" stroke-width="2"/>
  <rect x="560" y="342" width="43" height="76" fill="#f7f9fc" stroke="#16846d" stroke-width="2"/>
  <text x="568" y="565" class="part" text-anchor="middle">NEW flipped</text>
  <text x="568" y="589" class="part" text-anchor="middle">adapter</text>
  <text x="568" y="612" class="small" text-anchor="middle">design pending</text>

  <!-- Servo and ear flange -->
  <rect x="750" y="322" width="155" height="118" rx="8" fill="#175ab7" stroke="#0e3d7d" stroke-width="3"/>
  <rect x="716" y="354" width="34" height="54" rx="6" fill="#74a9ee" stroke="#0e3d7d" stroke-width="3"/>
  <circle cx="732" cy="381" r="8" fill="#ffffff" stroke="#0e3d7d" stroke-width="2"/>
  <rect x="905" y="354" width="34" height="54" rx="6" fill="#74a9ee" stroke="#0e3d7d" stroke-width="3"/>
  <circle cx="922" cy="381" r="8" fill="#ffffff" stroke="#0e3d7d" stroke-width="2"/>
  <rect x="939" y="363" width="64" height="36" rx="10" fill="#e3e8ef" stroke="#697687" stroke-width="3"/>
  <path d="M1003 381 H1138" stroke="#e3e8ef" stroke-width="21" stroke-linecap="round"/>
  <path d="M1003 381 H1138" stroke="#697687" stroke-width="2"/>
  <text x="826" y="565" class="part" text-anchor="middle">SG90 body + ears</text>
  <text x="1020" y="565" class="part" text-anchor="middle">original horn</text>
  <text x="1020" y="590" class="small" text-anchor="middle">faces the rod</text>

  <!-- Bolt paths -->
  <line x1="232" y1="285" x2="527" y2="285" stroke="#263547" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="232" y1="475" x2="527" y2="475" stroke="#263547" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="412" y="187" class="note" text-anchor="middle">M3 structural bolt path</text>
  <text x="412" y="209" class="small" text-anchor="middle">plate → support → new adapter</text>
  <line x1="634" y1="381" x2="710" y2="381" stroke="#d05d20" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="781" y="187" class="note" text-anchor="middle">M2 ear bolts</text>
  <text x="781" y="209" class="small" text-anchor="middle">adapter → two servo ears</text>

  <rect x="60" y="650" width="1280" height="145" rx="18" fill="#fff1d9" stroke="#dfb563" stroke-width="2"/>
  <text x="92" y="690" class="note">The small servo-fit coupon is only a gauge. It does not bolt to the rear plate.</text>
  <text x="92" y="724" class="subtitle">The rear plate's feet face the bin; its four M3 holes join the bell-crank support and future adapter.</text>
  <text x="92" y="758" class="subtitle">Check the coupon fit before printing the dashed adapter. Drawing is schematic, not to scale.</text>
</svg>
